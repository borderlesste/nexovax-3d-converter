<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NEXOVAX 3D Converter</title>
<meta name="description" content="NEXOVAX 3D Converter: conversor 3D offline para Windows — glTF, GLB, OBJ, FBX, STL, IFC, STEP, IGES.">
<link rel="icon" href="logo.png">
<style>
  :root { --blue: #1660e8; --orange: #f39a1e; --ink: #1d2733; --muted: #5b6b7c; --bg: #f4f7fb; --card: #fff; --line: #dbe3ee; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: "Segoe UI", system-ui, -apple-system, Arial, sans-serif; color: var(--ink); background: var(--bg); line-height: 1.55; }
  header { background: var(--card); border-bottom: 1px solid var(--line); }
  .wrap { max-width: 1040px; margin: 0 auto; padding: 0 20px; }
  .bar { display: flex; align-items: center; justify-content: space-between; height: 64px; }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 1.15rem; }
  .brand img { width: 36px; height: 36px; }
  .langs button { border: 1px solid var(--line); background: var(--card); padding: 6px 12px; border-radius: 6px; cursor: pointer; font: inherit; }
  .langs button[aria-pressed="true"] { background: var(--blue); color: #fff; border-color: var(--blue); }
  .hero { padding: 56px 0 32px; display: grid; grid-template-columns: 1.1fr 1fr; gap: 36px; align-items: center; }
  h1 { font-size: 2.3rem; line-height: 1.15; margin: 0 0 14px; }
  .lead { font-size: 1.12rem; color: var(--muted); margin: 0 0 24px; }
  .dl { display: inline-block; background: var(--blue); color: #fff; padding: 14px 26px; border-radius: 8px; font-weight: 700; text-decoration: none; box-shadow: 0 4px 14px rgba(22,96,232,.28); }
  .dl:hover { filter: brightness(1.08); }
  .meta { margin-top: 12px; font-size: .9rem; color: var(--muted); }
  .shot { width: 100%; border-radius: 10px; border: 1px solid var(--line); box-shadow: 0 12px 30px rgba(20,40,80,.14); }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; padding: 18px 0 40px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 18px; }
  .card h3 { margin: 0 0 6px; font-size: 1.02rem; }
  .card p { margin: 0; color: var(--muted); font-size: .95rem; }
  .formats { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 26px; }
  .formats span { background: #e8f0fe; color: #0f4fc4; border-radius: 999px; padding: 4px 12px; font-weight: 600; font-size: .9rem; }
  footer { border-top: 1px solid var(--line); padding: 22px 0; color: var(--muted); font-size: .88rem; }
  .accent { color: var(--orange); }
  @media (max-width: 820px) { .hero { grid-template-columns: 1fr; padding-top: 32px; } .grid { grid-template-columns: 1fr; } h1 { font-size: 1.8rem; } }
</style>
</head>
<body>
<header>
  <div class="wrap bar">
    <div class="brand"><img src="logo.png" alt="NEXOVAX"> NEXOVAX <span class="accent">3D</span> Converter</div>
    <div class="langs" role="group" aria-label="Idioma">
      <button data-l="es">ES</button><button data-l="fr">FR</button><button data-l="ht">HT</button>
    </div>
  </div>
</header>
<main class="wrap">
  <section class="hero">
    <div>
      <h1 data-t="title"></h1>
      <p class="lead" data-t="lead"></p>
      <div class="formats"><span>glTF</span><span>GLB</span><span>OBJ</span><span>FBX</span><span>STL</span><span>IFC</span><span>STEP</span><span>IGES</span></div>
      
      <a class="dl" href="https://github.com/borderlesste/nexovax-3d-converter/releases/latest/download/NEXOVAX3DConverter-Setup.exe" data-t="download"></a>
      <div class="meta" data-t="meta"></div>
    </div>
    <img class="shot" id="shot" src="captura_es.png" alt="NEXOVAX 3D Converter">
  </section>
  <section class="grid">
    <div class="card"><h3 data-t="f1h"></h3><p data-t="f1p"></p></div>
    <div class="card"><h3 data-t="f2h"></h3><p data-t="f2p"></p></div>
    <div class="card"><h3 data-t="f3h"></h3><p data-t="f3p"></p></div>
    <div class="card"><h3 data-t="f4h"></h3><p data-t="f4p"></p></div>
    <div class="card"><h3 data-t="f5h"></h3><p data-t="f5p"></p></div>
    <div class="card"><h3 data-t="f6h"></h3><p data-t="f6p"></p></div>
  </section>
</main>
<footer><div class="wrap" data-t="foot"></div></footer>
<script>
const T = {
  es: { title: "Convierte modelos 3D entre 8 formatos, sin Internet",
        lead: "Ingeniería, CAD, BIM, fabricación y visualización: una sola aplicación de escritorio para Windows que funciona completamente offline.",
        download: "Descargar para Windows", meta: "Windows 10/11 · 64 bits · ≈140 MB · gratis",
        f1h: "64 combinaciones", f1p: "Cualquier formato de entrada a cualquier formato de salida, eligiendo siempre la ruta más precisa.",
        f2h: "Precisión verificada", f2p: "Cada archivo generado se relee y se compara (dimensiones y objetos) antes de guardarlo.",
        f3h: "Honesta con las pérdidas", f3p: "Indica qué se conserva y qué se pierde: materiales, jerarquía, datos BIM o geometría exacta.",
        f4h: "CAD y BIM reales", f4p: "Open CASCADE para STEP/IGES e IfcOpenShell para IFC2X3/IFC4, integrados en la instalación.",
        f5h: "Por lotes y segura", f5p: "Cientos de archivos a la vez, en procesos aislados; el original nunca se modifica.",
        f6h: "Tres idiomas", f6p: "Español, français y kreyòl ayisyen.",
        foot: "NEXOVAX 3D Converter · Sin cuentas, sin nube, sin activación." },
  fr: { title: "Convertissez des modèles 3D entre 8 formats, sans Internet",
        lead: "Ingénierie, CAO, BIM, fabrication et visualisation : une seule application de bureau pour Windows, entièrement hors ligne.",
        download: "Télécharger pour Windows", meta: "Windows 10/11 · 64 bits · ≈140 Mo · gratuit",
        f1h: "64 combinaisons", f1p: "N'importe quel format d'entrée vers n'importe quel format de sortie, toujours par le chemin le plus précis.",
        f2h: "Précision vérifiée", f2p: "Chaque fichier généré est relu et comparé (dimensions et objets) avant d'être enregistré.",
        f3h: "Transparente sur les pertes", f3p: "Indique ce qui est conservé et ce qui est perdu : matériaux, hiérarchie, données BIM ou géométrie exacte.",
        f4h: "Vraie CAO et vrai BIM", f4p: "Open CASCADE pour STEP/IGES et IfcOpenShell pour IFC2X3/IFC4, inclus dans l'installation.",
        f5h: "Par lots et sûre", f5p: "Des centaines de fichiers à la fois, dans des processus isolés ; l'original n'est jamais modifié.",
        f6h: "Trois langues", f6p: "Español, français et kreyòl ayisyen.",
        foot: "NEXOVAX 3D Converter · Sans compte, sans cloud, sans activation." },
  ht: { title: "Konvèti modèl 3D ant 8 fòma, san entènèt",
        lead: "Jeni, CAD, BIM, fabrikasyon ak vizyalizasyon: yon sèl aplikasyon pou Windows ki mache nèt san entènèt.",
        download: "Telechaje pou Windows", meta: "Windows 10/11 · 64 bit · ≈140 MB · gratis",
        f1h: "64 konbinezon", f1p: "Nenpòt fòma antre rive nan nenpòt fòma sòti, toujou pa chemen ki pi presi a.",
        f2h: "Presizyon verifye", f2p: "Chak fichye ki fèt reli epi konpare (dimansyon ak objè) anvan li anrejistre.",
        f3h: "Li di sa ki pèdi", f3p: "Li montre sa ki rete ak sa ki pèdi: materyo, yerachi, done BIM oswa jewometri egzak.",
        f4h: "Vrè CAD ak BIM", f4p: "Open CASCADE pou STEP/IGES ak IfcOpenShell pou IFC2X3/IFC4, tout nan enstalasyon an.",
        f5h: "Anpil fichye an menm tan", f5p: "Plizyè santèn fichye, chak nan yon pwosesis izole; fichye orijinal la pa janm chanje.",
        f6h: "Twa lang", f6p: "Español, français ak kreyòl ayisyen.",
        foot: "NEXOVAX 3D Converter · San kont, san nyaj, san aktivasyon." }
};
function setLang(l) {
  document.documentElement.lang = l;
  document.querySelectorAll("[data-t]").forEach(e => e.textContent = T[l][e.dataset.t]);
  document.querySelectorAll(".langs button").forEach(b => b.setAttribute("aria-pressed", b.dataset.l === l));
  document.getElementById("shot").src = "captura_" + l + ".png";
  try { localStorage.setItem("lang", l); } catch (e) {}
}
document.querySelectorAll(".langs button").forEach(b => b.onclick = () => setLang(b.dataset.l));
let start = "es";
try { start = localStorage.getItem("lang") || ""; } catch (e) {}
if (!T[start]) { const n = (navigator.language || "es").toLowerCase(); start = n.startsWith("ht") ? "ht" : n.startsWith("fr") ? "fr" : "es"; }
setLang(start);
</script>
</body>
</html>
